{% extends "base.html" %}{% block title %}Login{% endblock %}
{% block content %}<div class="container"><div class="card auth">
<h1>Welcome back</h1><p class="muted">Log in to see your dashboard.</p>
<form method="post">
  <label>Email</label><input type="email" name="email" required>
  <label>Password</label><input type="password" name="password" required>
  <button class="btn" style="width:100%;margin-top:18px">Login</button>
</form>
<p class="center muted mt">New here? <a href="{{ url_for('register') }}">Create an account</a></p>
</div></div>{% endblock %}
