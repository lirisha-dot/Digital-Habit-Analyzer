{% extends "base.html" %}{% block title %}Register{% endblock %}
{% block content %}<div class="container"><div class="card auth">
<h1>Create account</h1><p class="muted">Start tracking your digital habits.</p>
<form method="post">
  <label>Full name</label><input name="full_name" required>
  <label>Email</label><input type="email" name="email" required>
  <label>Password (min 6 characters)</label><input type="password" name="password" required minlength="6">
  <label>Confirm password</label><input type="password" name="confirm" required>
  <button class="btn" style="width:100%;margin-top:18px">Register</button>
</form>
<p class="center muted mt">Already registered? <a href="{{ url_for('login') }}">Login</a></p>
</div></div>{% endblock %}
